services:
  mcp-network-tools:
    image: python:3.12-slim
    container_name: mcp-network-tools
    restart: unless-stopped

    network_mode: host

    ports:
      - "3337:8000"

    environment:
      - TZ=Europe/Amsterdam

    volumes:
      - mcp-network-tools_data:/app

    cap_add:
      - NET_RAW

    command: >
      sh -c "
        apt-get update &&
        apt-get install -y --no-install-recommends git ca-certificates iproute2 iputils-ping traceroute &&
        rm -rf /var/lib/apt/lists/* &&

        if [ ! -d /app/.git ]; then
          git clone https://github.com/DomoticX/mcp-network-tools.git /app;
        else
          cd /app && git pull;
        fi &&

        cd /app &&

        exec python3 mcp-network-tools.py --transport streamable-http --host 0.0.0.0 --port 8000
      "

volumes:
  mcp-network-tools_data: